solana-pubkey = "2.4.0"
spl-associated-token-account-client = "2.0.0"
solana-instruction = { version = "2.3.3", features = ["borsh"] }
clap = {  version = "4.5.0", features = ["derive"] }
borsh = "1.6.0"
